name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Accept Android SDK licenses
        run: |
          yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show error
        if: failure()
        run: |
          {
            echo '### Ошибка сборки'
            echo '```'
            grep -v '^\s*at ' build.log | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          msg=$(grep -A8 "What went wrong" build.log | head -12 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
